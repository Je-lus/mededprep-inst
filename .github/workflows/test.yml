name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Lint backend
        run: npm run lint

      - name: Test backend
        run: npm test

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: frontend-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-

      - name: Install frontend dependencies
        run: cd app && npm ci

      - name: Lint frontend
        run: cd app && npm run lint

      - name: Typecheck frontend
        run: cd app && npm run typecheck

      - name: Test frontend
        run: cd app && npm test

      - name: Build frontend
        run: cd app && npm run build
